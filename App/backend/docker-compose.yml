name: goevo

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goevo -d goevo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=goevo;Username=goevo;Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em App/backend/.env};Timeout=5;Command Timeout=10"
    ports:
      - "127.0.0.1:5286:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
